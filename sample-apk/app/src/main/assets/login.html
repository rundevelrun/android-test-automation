<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 12px; padding: 40px 32px; width: 90%; max-width: 380px; box-shadow: 0 2px 16px rgba(0,0,0,0.1); }
  h2 { text-align: center; color: #1a73e8; margin-bottom: 28px; font-size: 24px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  input { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 18px; outline: none; transition: border 0.2s; }
  input:focus { border-color: #1a73e8; }
  input.invalid { border-color: #e53935; }
  .btn { width: 100%; padding: 14px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn:disabled { background: #b0bec5; cursor: not-allowed; }
  .error { color: #e53935; font-size: 13px; margin-top: -12px; margin-bottom: 14px; display: none; }
  .error.show { display: block; }
  /* 계정 잠금 배너 */
  .lockout-banner { background: #fff3e0; border: 1px solid #ffb74d; border-radius: 8px; padding: 14px; margin-bottom: 18px; display: none; }
  .lockout-banner.show { display: block; }
  .lockout-title { font-size: 14px; font-weight: 700; color: #e65100; margin-bottom: 4px; }
  .lockout-desc { font-size: 13px; color: #bf360c; }
  .lockout-timer { font-size: 13px; color: #e65100; font-weight: 700; margin-top: 6px; }
  /* 실패 횟수 경고 */
  .attempt-warn { font-size: 12px; color: #f57c00; text-align: right; margin-top: -14px; margin-bottom: 12px; display: none; }
  .attempt-warn.show { display: block; }
</style>
</head>
<body>
<div class="card">
  <h2>ShopDemo</h2>

  <!-- 계정 잠금 배너 (에러 케이스: 5회 실패) -->
  <div class="lockout-banner" id="lockout_banner">
    <div class="lockout-title">🔒 계정이 일시 잠금되었습니다</div>
    <div class="lockout-desc">잘못된 비밀번호를 5회 입력했습니다.</div>
    <div class="lockout-timer" id="lockout_timer">30초 후 재시도 가능</div>
  </div>

  <label for="email">이메일</label>
  <input type="email" id="email" placeholder="test@example.com" autocomplete="off"
         oninput="validateEmail()" />

  <label for="password">비밀번호</label>
  <input type="password" id="password" placeholder="비밀번호 입력" />

  <p class="error" id="error_msg"></p>

  <!-- 실패 횟수 경고 (3~4회) -->
  <div class="attempt-warn" id="attempt_warn"></div>

  <button class="btn" id="login_btn" onclick="doLogin()">로그인</button>
</div>

<script>
  var MAX_ATTEMPTS = 5;
  var LOCKOUT_SECONDS = 30;
  var failCount = parseInt(sessionStorage.getItem('login_fail_count') || '0');
  var lockoutUntil = parseInt(sessionStorage.getItem('login_lockout_until') || '0');
  var lockoutTimer = null;

  function validateEmail() {
    var email = document.getElementById('email').value;
    var input = document.getElementById('email');
    var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (email && !emailRegex.test(email)) {
      input.classList.add('invalid');
    } else {
      input.classList.remove('invalid');
    }
  }

  function isEmailValid(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function showError(msg) {
    var el = document.getElementById('error_msg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function clearError() {
    document.getElementById('error_msg').classList.remove('show');
    document.getElementById('attempt_warn').classList.remove('show');
  }

  function checkLockout() {
    var now = Date.now();
    if (lockoutUntil > now) {
      applyLockout(Math.ceil((lockoutUntil - now) / 1000));
      return true;
    }
    return false;
  }

  function applyLockout(seconds) {
    var banner = document.getElementById('lockout_banner');
    var btn = document.getElementById('login_btn');
    banner.classList.add('show');
    btn.disabled = true;

    var remaining = seconds;
    document.getElementById('lockout_timer').textContent = remaining + '초 후 재시도 가능';

    if (lockoutTimer) clearInterval(lockoutTimer);
    lockoutTimer = setInterval(function() {
      remaining--;
      document.getElementById('lockout_timer').textContent = remaining + '초 후 재시도 가능';
      if (remaining <= 0) {
        clearInterval(lockoutTimer);
        banner.classList.remove('show');
        btn.disabled = false;
        failCount = 0;
        sessionStorage.removeItem('login_fail_count');
        sessionStorage.removeItem('login_lockout_until');
      }
    }, 1000);
  }

  function doLogin() {
    if (checkLockout()) return;

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    clearError();

    // 빈 값 검증
    if (!email || !password) {
      showError('이메일과 비밀번호를 모두 입력해주세요.');
      return;
    }

    // 이메일 형식 검증
    if (!isEmailValid(email)) {
      showError('올바른 이메일 형식을 입력해주세요. (예: user@example.com)');
      document.getElementById('email').classList.add('invalid');
      return;
    }

    // 인증
    if (email === 'test@example.com' && password === 'password123') {
      failCount = 0;
      sessionStorage.removeItem('login_fail_count');
      sessionStorage.removeItem('login_lockout_until');
      sessionStorage.setItem('logged_in', 'true');
      sessionStorage.setItem('user_email', email);
      AndroidBridge.navigate('products.html');
      return;
    }

    // 실패 처리
    failCount++;
    sessionStorage.setItem('login_fail_count', failCount);

    if (failCount >= MAX_ATTEMPTS) {
      var until = Date.now() + LOCKOUT_SECONDS * 1000;
      lockoutUntil = until;
      sessionStorage.setItem('login_lockout_until', until);
      failCount = 0;
      sessionStorage.setItem('login_fail_count', '0');
      applyLockout(LOCKOUT_SECONDS);
      showError('계정이 잠금되었습니다. ' + LOCKOUT_SECONDS + '초 후 다시 시도해주세요.');
    } else {
      var remaining = MAX_ATTEMPTS - failCount;
      showError('이메일 또는 비밀번호가 올바르지 않습니다.');
      if (failCount >= 3) {
        var warn = document.getElementById('attempt_warn');
        warn.textContent = '⚠ 로그인 실패 ' + failCount + '회 — ' + remaining + '회 더 실패 시 계정이 잠깁니다.';
        warn.classList.add('show');
      }
    }
  }

  // 페이지 진입 시 잠금 상태 복원
  checkLockout();
</script>
</body>
</html>
