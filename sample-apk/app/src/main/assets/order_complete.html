<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문 완료</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  .check-circle { width: 80px; height: 80px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 20px; }
  h2 { font-size: 22px; color: #111; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #888; margin-bottom: 32px; }
  .order-card { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .order-card-title { font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
  .info-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; }
  .info-label { color: #888; }
  .info-value { color: #111; font-weight: 600; }
  .order-number { font-size: 16px; color: #1a73e8; font-weight: 700; font-family: monospace; }
  .item-row { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
  .item-row:last-child { border-bottom: none; }
  .total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; padding-top: 12px; border-top: 1px solid #eee; margin-top: 4px; }
  .btn { display: block; width: 100%; max-width: 380px; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; border: none; margin-bottom: 12px; }
  .btn-home { background: #1a73e8; color: #fff; }
  .btn-list { background: #fff; color: #1a73e8; border: 1.5px solid #1a73e8; }
</style>
</head>
<body>

<div class="check-circle">✅</div>
<h2 id="complete_title">주문이 완료되었습니다!</h2>
<p class="subtitle">결제가 정상 처리되었습니다.</p>

<div class="order-card">
  <div class="order-card-title">주문 정보</div>
  <div class="info-row">
    <span class="info-label">주문번호</span>
    <span class="info-value order-number" id="order_number">-</span>
  </div>
  <div class="info-row">
    <span class="info-label">주문일시</span>
    <span class="info-value" id="order_date">-</span>
  </div>
</div>

<div class="order-card">
  <div class="order-card-title">주문 상품</div>
  <div id="order_items"></div>
  <div class="total-row">
    <span>합계</span>
    <span id="order_total">₩0</span>
  </div>
</div>

<button class="btn btn-home" id="home_btn" onclick="AndroidBridge.navigate('products.html')">쇼핑 계속하기</button>
<button class="btn btn-list" id="order_list_btn" onclick="showOrderList()">주문 목록 보기</button>

<script>
  function pad(n) { return n < 10 ? '0' + n : n; }

  function init() {
    var orderNumber = sessionStorage.getItem('order_number') || 'ORD-UNKNOWN';
    var order = JSON.parse(sessionStorage.getItem('last_order') || '[]');
    var now = new Date();
    var dateStr = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate())
      + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());

    document.getElementById('order_number').textContent = orderNumber;
    document.getElementById('order_date').textContent = dateStr;

    var total = 0;
    var itemsHtml = order.map(function(item) {
      var amount = item.price * item.qty;
      total += amount;
      return '<div class="item-row">'
        + '<span>' + item.name + ' × ' + item.qty + '</span>'
        + '<span>₩' + amount.toLocaleString() + '</span>'
        + '</div>';
    }).join('');

    document.getElementById('order_items').innerHTML = itemsHtml;
    document.getElementById('order_total').textContent = '₩' + total.toLocaleString();
  }

  function showOrderList() {
    // 주문 목록 기능 미구현 안내 (TC 확장 여지)
    alert('주문 목록 기능은 준비 중입니다.');
  }

  init();
</script>
</body>
</html>
