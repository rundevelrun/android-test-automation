<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장바구니</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
  .empty-state { text-align: center; padding: 80px 20px; color: #aaa; }
  .empty-icon { font-size: 64px; margin-bottom: 16px; }
  .empty-text { font-size: 16px; margin-bottom: 20px; }
  .empty-btn { padding: 12px 32px; background: #1a73e8; color: #fff; border: none; border-radius: 24px; font-size: 15px; cursor: pointer; }
  .cart-item { background: #fff; margin: 10px 12px; border-radius: 10px; padding: 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .item-emoji { font-size: 36px; min-width: 48px; text-align: center; }
  .item-info { flex: 1; }
  .item-name { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 4px; }
  .item-price { font-size: 13px; color: #888; }
  .item-qty-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .qty-btn { width: 28px; height: 28px; border: 1px solid #ddd; background: #fff; border-radius: 6px; font-size: 16px; cursor: pointer; }
  .qty-val { font-size: 14px; font-weight: 700; min-width: 24px; text-align: center; }
  .item-total { font-size: 15px; font-weight: 700; color: #1a73e8; }
  .remove-btn { padding: 6px 12px; background: #fce4e4; color: #e53935; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }
  /* 쿠폰 입력 */
  .coupon-box { background: #fff; margin: 0 12px 0; border-radius: 10px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-top: 10px; }
  .coupon-row { display: flex; gap: 8px; }
  .coupon-input { flex: 1; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
  .coupon-input:focus { border-color: #1a73e8; }
  .coupon-btn { padding: 10px 16px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .coupon-msg { font-size: 12px; margin-top: 8px; display: none; }
  .coupon-msg.success { color: #43a047; display: block; }
  .coupon-msg.error { color: #e53935; display: block; }
  /* 결제 실패 배너 */
  .payment-error-banner { background: #fce4e4; border: 1px solid #ef9a9a; border-radius: 10px; margin: 10px 12px; padding: 14px; display: none; }
  .payment-error-banner.show { display: block; }
  .payment-error-title { font-size: 14px; font-weight: 700; color: #c62828; margin-bottom: 6px; }
  .payment-error-desc { font-size: 13px; color: #b71c1c; line-height: 1.5; }
  .payment-error-code { font-size: 11px; color: #9e9e9e; margin-top: 6px; font-family: monospace; }
  /* 요약 */
  .summary { background: #fff; margin: 10px 12px; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .summary-row { display: flex; justify-content: space-between; font-size: 14px; color: #555; margin-bottom: 10px; }
  .summary-discount { color: #43a047; }
  .summary-total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 800; color: #111; padding-top: 10px; border-top: 1px solid #f0f0f0; }
  .order-btn { display: block; width: calc(100% - 24px); margin: 12px; padding: 16px; background: #1a73e8; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .order-btn:disabled { background: #b0bec5; cursor: not-allowed; }
</style>
</head>
<body>

<!-- 에러 케이스: 결제 실패 배너 -->
<div class="payment-error-banner" id="payment_error_banner">
  <div class="payment-error-title">❌ 결제에 실패했습니다</div>
  <div class="payment-error-desc">일시적인 오류가 발생했습니다. 잠시 후 다시 시도하거나 다른 결제 수단을 이용해주세요.</div>
  <div class="payment-error-code" id="payment_error_code"></div>
</div>

<div id="cart_container"></div>

<script>
  var VALID_COUPONS = {
    'SAVE10':   { label: '10% 할인', rate: 0.10 },
    'WELCOME':  { label: '5% 신규 할인', rate: 0.05 },
    'FAIL_TEST': null,  // 에러 케이스: 결제 실패 트리거 쿠폰
  };

  var appliedCoupon = null;

  var products = [
    { id: 1,  name: '무선 블루투스 이어폰', emoji: '🎧' },
    { id: 2,  name: '스마트워치 SE',         emoji: '⌚' },
    { id: 3,  name: '린넨 반팔 셔츠',        emoji: '👕' },
    { id: 4,  name: '슬림핏 청바지',          emoji: '👖' },
    { id: 5,  name: '유기농 그래놀라',        emoji: '🌾' },
    { id: 6,  name: '아메리카노 원두 500g',   emoji: '☕' },
    { id: 7,  name: '노이즈캔슬링 헤드폰',    emoji: '🎵' },
    { id: 8,  name: '캐주얼 스니커즈',        emoji: '👟' },
    { id: 9,  name: '한정판 기계식 키보드',   emoji: '⌨️' },
    { id: 10, name: '프리미엄 가죽 벨트',     emoji: '👜' },
  ];

  function getEmoji(id) {
    var p = products.find(function(p) { return p.id === id; });
    return p ? p.emoji : '📦';
  }

  function getCart() {
    return JSON.parse(sessionStorage.getItem('cart') || '[]');
  }

  function saveCart(cart) {
    sessionStorage.setItem('cart', JSON.stringify(cart));
    var total = cart.reduce(function(sum, item) { return sum + item.qty; }, 0);
    AndroidBridge.updateCartBadge(total);
  }

  function changeQty(id, delta) {
    var cart = getCart();
    var item = cart.find(function(i) { return i.id === id; });
    if (item) {
      item.qty = Math.max(1, Math.min(10, item.qty + delta));
      saveCart(cart);
    }
    render();
  }

  function removeItem(id) {
    var cart = getCart().filter(function(i) { return i.id !== id; });
    saveCart(cart);
    render();
  }

  var couponMsgText = '';
  var couponMsgCls = 'coupon-msg';

  function applyCouponMsg(text, cls) {
    couponMsgText = text;
    couponMsgCls = cls;
    var el = document.getElementById('coupon_msg');
    if (el) { el.textContent = text; el.className = cls; }
  }

  function applyCoupon() {
    var code = document.getElementById('coupon_input').value.trim().toUpperCase();

    if (!code) {
      applyCouponMsg('쿠폰 코드를 입력해주세요.', 'coupon-msg error');
      return;
    }

    if (!(code in VALID_COUPONS)) {
      appliedCoupon = null;
      render();
      applyCouponMsg('유효하지 않은 쿠폰 코드입니다.', 'coupon-msg error');
      return;
    }

    var coupon = VALID_COUPONS[code];
    if (coupon === null) {
      appliedCoupon = { code: code, label: '테스트 쿠폰', rate: 0, forceFailure: true };
      render();
      applyCouponMsg('쿠폰이 적용되었습니다.', 'coupon-msg success');
    } else {
      appliedCoupon = { code: code, label: coupon.label, rate: coupon.rate, forceFailure: false };
      render();
      applyCouponMsg(coupon.label + ' 쿠폰이 적용되었습니다.', 'coupon-msg success');
    }
  }

  function render() {
    var cart = getCart();
    var container = document.getElementById('cart_container');

    if (cart.length === 0) {
      container.innerHTML = '<div class="empty-state">'
        + '<div class="empty-icon">🛒</div>'
        + '<div class="empty-text">장바구니가 비어 있습니다.</div>'
        + '<button class="empty-btn" id="continue_shopping_btn" onclick="AndroidBridge.navigate(\'products.html\')">쇼핑 계속하기</button>'
        + '</div>';
      return;
    }

    var itemsHtml = cart.map(function(item) {
      return '<div class="cart-item" id="cart_item_' + item.id + '">'
        + '<div class="item-emoji">' + getEmoji(item.id) + '</div>'
        + '<div class="item-info">'
        + '<div class="item-name">' + item.name + '</div>'
        + '<div class="item-price">₩' + item.price.toLocaleString() + ' / 개</div>'
        + '<div class="item-qty-row">'
        + '<button class="qty-btn" onclick="changeQty(' + item.id + ', -1)">−</button>'
        + '<span class="qty-val" id="qty_' + item.id + '">' + item.qty + '</span>'
        + '<button class="qty-btn" onclick="changeQty(' + item.id + ', 1)">+</button>'
        + '<button class="remove-btn" onclick="removeItem(' + item.id + ')">삭제</button>'
        + '</div></div>'
        + '<div class="item-total">₩' + (item.price * item.qty).toLocaleString() + '</div>'
        + '</div>';
    }).join('');

    var subtotal = cart.reduce(function(sum, item) { return sum + item.price * item.qty; }, 0);
    var discount = appliedCoupon ? Math.floor(subtotal * appliedCoupon.rate) : 0;
    var shipping = (subtotal - discount) >= 50000 ? 0 : 3000;
    var total = subtotal - discount + shipping;

    var discountRow = appliedCoupon && discount > 0
      ? '<div class="summary-row summary-discount"><span>쿠폰 할인 (' + appliedCoupon.label + ')</span><span>-₩' + discount.toLocaleString() + '</span></div>'
      : '';

    var couponHtml = '<div class="coupon-box">'
      + '<div class="coupon-row">'
      + '<input class="coupon-input" id="coupon_input" placeholder="쿠폰 코드 입력" />'
      + '<button class="coupon-btn" id="apply_coupon_btn" onclick="applyCoupon()">적용</button>'
      + '</div>'
      + '<div class="coupon-msg" id="coupon_msg"></div>'
      + '</div>';

    var summaryHtml = '<div class="summary">'
      + '<div class="summary-row"><span>상품 합계</span><span id="subtotal_price">₩' + subtotal.toLocaleString() + '</span></div>'
      + discountRow
      + '<div class="summary-row"><span>배송비</span><span>' + (shipping === 0 ? '무료' : '₩' + shipping.toLocaleString()) + '</span></div>'
      + '<div class="summary-total"><span>최종 결제</span><span id="total_price">₩' + total.toLocaleString() + '</span></div>'
      + '</div>'
      + '<button class="order-btn" id="order_btn" onclick="proceedOrder()">주문하기 (₩' + total.toLocaleString() + ')</button>';

    container.innerHTML = itemsHtml + couponHtml + summaryHtml;
  }

  function proceedOrder() {
    var cart = getCart();
    if (cart.length === 0) return;

    // 에러 케이스: FAIL_TEST 쿠폰 적용 시 결제 실패 시뮬레이션
    if (appliedCoupon && appliedCoupon.forceFailure) {
      var errorCode = 'ERR_PAYMENT_' + Math.floor(Math.random() * 9000 + 1000);
      var banner = document.getElementById('payment_error_banner');
      document.getElementById('payment_error_code').textContent = '오류 코드: ' + errorCode;
      banner.classList.add('show');
      banner.scrollIntoView({ behavior: 'smooth' });
      return;
    }

    sessionStorage.setItem('last_order', JSON.stringify(cart));
    sessionStorage.setItem('order_number', 'ORD-' + Date.now().toString().slice(-8));
    sessionStorage.removeItem('cart');
    AndroidBridge.updateCartBadge(0);
    AndroidBridge.navigate('order_complete.html');
  }

  render();
</script>
</body>
</html>
