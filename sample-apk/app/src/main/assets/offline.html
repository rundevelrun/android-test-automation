<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연결 오류</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; text-align: center; padding: 20px; }
  .icon { font-size: 72px; margin-bottom: 20px; }
  h2 { font-size: 20px; color: #333; margin-bottom: 10px; }
  p { font-size: 14px; color: #888; margin-bottom: 28px; line-height: 1.5; }
  .retry-btn { padding: 14px 40px; background: #1a73e8; color: #fff; border: none; border-radius: 24px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .status { font-size: 13px; color: #aaa; margin-top: 16px; }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h2>인터넷에 연결할 수 없습니다</h2>
  <p>네트워크 연결을 확인하고<br>다시 시도해주세요.</p>
  <button class="retry-btn" id="retry_btn" onclick="retry()">다시 시도</button>
  <div class="status" id="network_status">네트워크 상태 확인 중...</div>

<script>
  // TC-06: 네트워크 상태 확인 후 복구 시 리다이렉트
  function retry() {
    var isConnected = AndroidBridge.checkNetworkStatus();
    var statusEl = document.getElementById('network_status');
    if (isConnected) {
      statusEl.textContent = '연결됨. 페이지를 불러오는 중...';
      AndroidBridge.navigate('products.html');
    } else {
      statusEl.textContent = '여전히 연결되지 않았습니다. 잠시 후 다시 시도해주세요.';
    }
  }

  // 페이지 로드 시 상태 표시
  window.onload = function() {
    var isConnected = AndroidBridge.checkNetworkStatus();
    document.getElementById('network_status').textContent =
      isConnected ? '네트워크 복구됨 — 재시도 버튼을 누르세요.' : '오프라인 상태';
  };
</script>
</body>
</html>
