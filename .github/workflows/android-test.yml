name: Android WebView Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:       # 수동 실행 허용

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # 같은 브랜치 중복 실행 취소

jobs:
  # ─────────────────────────────────────────────
  # Job 1: APK 빌드
  # ─────────────────────────────────────────────
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle-wrapper.jar 없이 동작 — Gradle을 직접 설치하고 캐시
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        working-directory: sample-apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: sample-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2: Appium 테스트 (에뮬레이터)
  # ─────────────────────────────────────────────
  appium-test:
    name: Appium Test (API ${{ matrix.api-level }})
    needs: build-apk
    runs-on: ubuntu-latest  # 에뮬레이터는 Linux 기준

    strategy:
      fail-fast: false
      matrix:
        api-level: [34]   # 필요 시 [33, 34] 등 확장 가능

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. 빌드된 APK 다운로드 ──
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk/

      # ── 2. Java ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js + Appium ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Appium and npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-appium-${{ runner.os }}

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium -v

      # ── 4. Python 환경 ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt

      # ── 5. Android SDK 캐시 ──
      - name: Enable KVM (에뮬레이터 하드웨어 가속)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android SDK AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ matrix.api-level }}-x86_64-v1

      # ── 6. AVD 생성 (캐시 미스 시) ──
      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "AVD snapshot created"

      # ── 7. Appium 서버 백그라운드 시작 ──
      - name: Start Appium server
        run: |
          appium \
            --address 127.0.0.1 \
            --port 4723 \
            --log appium.log \
            --relaxed-security \
            &
          # 서버 준비 대기
          for i in {1..20}; do
            curl -s http://127.0.0.1:4723/status | grep -q '"ready":true' && break
            echo "Appium 대기 중... ($i/20)"
            sleep 2
          done
          echo "Appium 서버 준비 완료"

      # ── 8. 에뮬레이터 실행 + 테스트 ──
      - name: Run Appium tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # 에뮬레이터 완전 부팅 대기
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            echo "에뮬레이터 부팅 완료"

            # 에뮬레이터 디바이스명 확인
            DEVICE=$(adb devices | grep -v "List of" | grep "device$" | awk '{print $1}' | head -1)
            echo "디바이스: $DEVICE"

            # APK 설치 (DEVICE가 비어있으면 기본 디바이스에 설치)
            if [ -n "$DEVICE" ]; then
              adb -s "$DEVICE" install -r apk/app-debug.apk
            else
              adb install -r apk/app-debug.apk
              DEVICE=$(adb devices | grep -v "List of" | grep "device$" | awk '{print $1}' | head -1)
            fi
            echo "APK 설치 완료 (디바이스: $DEVICE)"

            # WebView 버전 감지 및 capabilities 동적 생성
            python3 scripts/ci_setup_capabilities.py "$DEVICE"

            # 테스트 실행
            cd tests
            mkdir -p reports
            pytest test_cases/ \
              -v \
              --html=reports/report.html \
              --self-contained-html \
              --junitxml=reports/junit.xml \
              -p no:cacheprovider \
              || true   # 테스트 실패해도 artifact 업로드는 진행

      # ── 9. 결과물 업로드 ──
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-api${{ matrix.api-level }}
          path: tests/reports/
          retention-days: 14

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-api${{ matrix.api-level }}
          path: tests/reports/screenshots/
          if-no-files-found: ignore   # 실패 없으면 조용히 스킵
          retention-days: 14

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log-api${{ matrix.api-level }}
          path: appium.log
          retention-days: 7

      # ── 10. JUnit 결과를 PR에 표시 ──
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: tests/reports/junit.xml
          check_name: "Test Results (API ${{ matrix.api-level }})"
